name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: coursepilot_test
          POSTGRES_USER: coursepilot
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursepilot -d coursepilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://coursepilot:ci-postgres-password@127.0.0.1:5432/coursepilot_test
      COURSEPILOT_POSTGRES_TEST_URL: postgresql+asyncpg://coursepilot:ci-postgres-password@127.0.0.1:5432/coursepilot_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      READINESS_CHECK_REDIS: "false"
      READINESS_CHECK_NEO4J: "false"
      READINESS_CHECK_INDEX: "false"
      READINESS_CHECK_LLM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Apply migrations on a clean database
        run: alembic upgrade head

      - name: Check model and migration alignment
        run: alembic check

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable the pinned pnpm version
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:web

      - name: Typecheck
        run: pnpm typecheck:web

      - name: Build
        run: pnpm build:web

  compose:
    name: Compose config and migration smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build the shared API image
        run: docker compose --env-file .env.example build api

      - name: Start PostgreSQL
        run: docker compose --env-file .env.example up --detach --wait postgres

      - name: Run the one-shot migration service
        run: docker compose --env-file .env.example run --rm migrate

      - name: Tear down smoke-test resources
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
