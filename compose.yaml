name: ${COMPOSE_PROJECT_NAME:-coursepilot}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# SECURITY — local-only defaults.
# Every "*-change-me" password (PostgreSQL, Redis, Neo4j) and the JWT_SECRET
# placeholder below are non-secrets intended exclusively for local Docker
# Compose development. Before ANY non-local deployment you MUST override them
# via environment variables or a real .env file (see .env.example):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, NEO4J_PASSWORD, JWT_SECRET,
#   LLM_API_KEY. Never deploy with these defaults.
x-api-environment: &api-environment
  APP_NAME: CoursePilot API
  ENVIRONMENT: ${ENVIRONMENT:-development}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://coursepilot:local-postgres-password-change-me@postgres:5432/coursepilot}
  REDIS_URL: ${REDIS_URL:-redis://:local-redis-password-change-me@redis:6379/0}
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-neo4j-password-change-me}
  JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-string-at-least-32-bytes-long}
  JWT_ISSUER: ${JWT_ISSUER:-coursepilot-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-coursepilot-web}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
  INVITE_TTL_DAYS: ${INVITE_TTL_DAYS:-30}
  READINESS_CHECK_REDIS: ${READINESS_CHECK_REDIS:-true}
  READINESS_CHECK_NEO4J: ${READINESS_CHECK_NEO4J:-true}
  READINESS_CHECK_INDEX: ${READINESS_CHECK_INDEX:-true}
  READINESS_CHECK_LLM: ${READINESS_CHECK_LLM:-false}
  READINESS_CHECK_MIGRATIONS: ${READINESS_CHECK_MIGRATIONS:-true}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-replace-with-an-openai-compatible-model}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  MODEL_ALLOW_DOWNLOAD: ${MODEL_ALLOW_DOWNLOAD:-false}
  UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/uploads}
  INDEX_ROOT: ${INDEX_ROOT:-/data/indexes}
  HF_HOME: ${HF_HOME:-/data/models/huggingface}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}

x-api-service: &api-service
  image: coursepilot-api:${COURSEPILOT_IMAGE_TAG:-dev}
  build:
    context: ./apps/api
    dockerfile: Dockerfile
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - backend

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coursepilot}
      POSTGRES_USER: ${POSTGRES_USER:-coursepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    shm_size: 128mb
    networks:
      - backend

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password-change-me}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-local-redis-password-change-me}
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  neo4j:
    image: neo4j:5.26.30-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-local-neo4j-password-change-me}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://127.0.0.1:7687 -u "${NEO4J_USERNAME:-neo4j}" -p "${NEO4J_PASSWORD:-local-neo4j-password-change-me}" "RETURN 1;" >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    stop_grace_period: 30s
    networks:
      - backend

  migrate:
    <<: *api-service
    restart: "no"
    command:
      - alembic
      - upgrade
      - head
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-service
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads_data:/data/uploads
      - indexes_data:/data/indexes
      - model_cache:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    networks:
      - edge
      - backend

  worker:
    <<: *api-service
    restart: unless-stopped
    command:
      - python
      - -m
      - celery
      - -A
      - app.worker:celery_app
      - worker
      - --beat
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=${CELERY_LOG_LEVEL:-INFO}
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - --hostname=worker@%h
    environment: *api-environment
    volumes:
      - uploads_data:/data/uploads
      - indexes_data:/data/indexes
      - model_cache:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -m celery -A app.worker:celery_app inspect ping --destination "worker@$${HOSTNAME}" --timeout 5 2>/dev/null | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 40s
    stop_grace_period: 60s

  web:
    image: coursepilot-web:${COURSEPILOT_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - edge

networks:
  edge:
  backend:

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  uploads_data:
  indexes_data:
  model_cache:
